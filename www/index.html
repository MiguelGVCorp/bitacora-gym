<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111214">
<title>Bitácora de Gym</title>
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
/* Layout: one narrow training column (phone-first), sticky tab header, fixed rest-timer bar at the bottom. */
:root{
  --sa-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sa-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sa-left:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));--sa-right:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  --bg:#f2f1ee; --surface:#ffffff; --surface-2:#e9e7e2; --text:#17181b; --muted:#666970; --line:#d9d6cf;
  --accent:#d9481f; --accent-ink:#ffffff; --accent-soft:#f8e2d9; --ok:#1f8a5a; --ok-soft:#dcf0e5; --danger:#bf3434;
  --timer-bg:#17181b; --timer-fg:#f4f3f0; --scrim:rgba(20,20,22,.45);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --surface:#1a1b1e; --surface-2:#24262a; --text:#f1f1ee; --muted:#9c9ea4; --line:#2e3035;
    --accent:#ff6a3d; --accent-ink:#1a0c06; --accent-soft:#3a2219; --ok:#3cbf85; --ok-soft:#183126; --danger:#ff6b6b;
    --timer-bg:#f1f1ee; --timer-fg:#141517; --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1a1b1e; --surface-2:#24262a; --text:#f1f1ee; --muted:#9c9ea4; --line:#2e3035;
  --accent:#ff6a3d; --accent-ink:#1a0c06; --accent-soft:#3a2219; --ok:#3cbf85; --ok-soft:#183126; --danger:#ff6b6b;
  --timer-bg:#f1f1ee; --timer-fg:#141517; --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body);padding-top:var(--sa-top);padding-bottom:calc(130px + var(--sa-bottom));overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sa-top);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,var(--sa-left));padding-right:max(16px,var(--sa-right))}

header.top{position:sticky;top:var(--sa-top);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="cloud"] i{background:var(--ok)}
.sync[data-s="pending"] i{background:var(--accent)}
.sync{display:none}
.top-actions{display:flex;align-items:center;gap:10px;min-width:0}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text);padding:0;flex:none}
.gear svg{width:20px;height:20px}
.gear[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.set-key{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;font-family:ui-monospace,monospace}
a.link{display:inline-block;text-decoration:none}

.tabs{display:flex;gap:4px;padding-bottom:10px}
.tab{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;border-radius:10px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);outline:1px solid var(--line)}

.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 12px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;text-align:center;position:relative}
.day b{display:block;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.day small{color:var(--muted);font-size:12px}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day .sug{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}

.session{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.clock{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;line-height:1.05}
.progress-txt{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;padding:14px;font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}
.link.muted{color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.complete{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.card h3{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.005em;line-height:1.15;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.prev{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:6px 9px;margin:10px 0 8px;font-variant-numeric:tabular-nums}
.prev b{color:var(--text);font-weight:600}
.set-head,.set{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.set-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:0 0 4px}
.set{padding:4px 0}
.set .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:13px}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 8px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.set input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.check{width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;color:var(--muted);display:grid;place-items:center}
.set.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done .n{background:var(--ok-soft);color:var(--ok)}
.set.done input{background:var(--ok-soft);border-color:transparent}
.card-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:4px}
textarea{width:100%;min-height:74px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;resize:vertical;margin:4px 0 12px}

.restbar{position:fixed;left:0;right:0;bottom:0;z-index:25;transform:translateY(120%);transition:transform .25s ease;padding-left:max(12px,var(--sa-left));padding-right:max(12px,var(--sa-right));padding-bottom:calc(12px + var(--sa-bottom))}
.restbar.show{transform:none}
.restbar .inner{max-width:696px;margin:0 auto;background:var(--timer-bg);color:var(--timer-fg);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.restbar .t{font-family:var(--display);font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;min-width:84px;line-height:1}
.restbar .lbl{flex:1;min-width:0;font-size:13px;opacity:.8;line-height:1.25}
.swap{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.swap select{flex:1;min-width:0;margin:0;padding:7px 10px;border-radius:9px;font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);background:var(--bg)}
.exnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.unit-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:middle}
.restbar{touch-action:manipulation}
.restbar button{min-width:46px;min-height:46px;touch-action:manipulation}
#restLbl{display:block}
.restbar .tap{font-size:11px;opacity:.85;display:none;margin-top:2px}
.restbar.over .tap{display:block}
.restbar button{border:0;border-radius:10px;padding:10px 11px;background:color-mix(in srgb,var(--timer-fg) 16%,transparent);color:var(--timer-fg);font-weight:700}
.restbar.over .inner{background:var(--ok);color:#fff}
.restbar.over button{color:#fff;background:rgba(255,255,255,.2)}
.restbar .bar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--timer-fg) 22%,transparent);margin-top:6px;overflow:hidden}
.restbar .bar i{display:block;height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion: reduce){.restbar{transition:none}}

.empty{text-align:center;color:var(--muted);padding:40px 10px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.hist summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist .when{font-weight:600;text-transform:capitalize}
.hist .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-family:var(--display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.wait{background:var(--surface-2);color:var(--muted);font-family:var(--body);font-size:11px;text-transform:none;letter-spacing:0;font-weight:600}
.hist .body{padding:0 14px 12px;border-top:1px solid var(--line)}
.hist .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hist .row:last-of-type{border-bottom:0}
.hist .row span:first-child{min-width:0}
.hist .row span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hist .note{font-size:13px;color:var(--muted);margin:8px 0;white-space:pre-wrap}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{color:var(--muted);font-size:12px}
select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-top:16px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:12px;overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;min-width:300px}
h2{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:24px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:60ch}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.modal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,var(--sa-right)) calc(16px + var(--sa-bottom)) max(16px,var(--sa-left))}
[hidden]{display:none!important}
.modal .sheet{background:var(--surface);border-radius:18px;padding:18px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal p{margin:0 0 16px;font-size:16px;line-height:1.4}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;top:calc(var(--sa-top) + 14px);transform:translate(-50%,-20px);opacity:0;z-index:45;background:var(--timer-bg);color:var(--timer-fg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;min-width:0}
.form-grid .wide{grid-column:1/-1}
.form-grid input,.form-grid select{margin:0;width:100%;min-width:0;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text)}
.row-btns{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.row-btns .link{margin-right:auto}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px}
.daynav>div{text-align:center;min-width:0}
.daynav b{display:block;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.daynav small{color:var(--muted);font-size:13px}
.daynav .btn{width:46px;height:42px;padding:0;font-size:22px;line-height:1}
.daynav .btn:disabled{opacity:.35}
.kc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
.kc-big{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kc-big span{font-size:20px;font-weight:700;color:var(--muted)}
.kc-side{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kc-side .link{padding:2px 0;font-size:13px}
.mbar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.mbar.big{height:10px}
.mbar i{display:block;height:100%;background:var(--muted);border-radius:inherit}
.mbar.big i{background:var(--accent)}
.mbar.prot i{background:var(--ok)}
.mbar.over i{background:var(--danger)}
.mbar.prot.over i{background:var(--ok)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.macros b{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
.macros b small{font-size:12px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rep{font-weight:500;background:var(--surface)}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
#view-food textarea{margin:0 0 8px;background:var(--bg)}
.preview{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}
.pv-row{display:grid;grid-template-columns:minmax(0,1fr) 76px 36px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.pv-name{min-width:0}
.pv-name b{display:block;font-weight:600;overflow-wrap:anywhere}
.pv-name small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pv-row input{width:100%;padding:8px 6px;border:1px solid var(--line);border-radius:9px;background:var(--bg);text-align:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border:0;border-radius:9px;background:var(--surface-2);color:var(--muted)}
.pv-total{display:flex;justify-content:space-between;padding:10px 0;font-size:15px}
.pv-total b{font-family:var(--display);font-size:22px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meal-h b{font-variant-numeric:tabular-nums}
.entry{padding:8px 0;border-top:1px dashed var(--line);margin-top:8px}
.entry-t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.entry-t span{min-width:0;overflow-wrap:anywhere}
.entry-t .link{padding:0;font-size:13px}
.it{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:2px 0}
.it span:first-child{min-width:0}
.it small{color:var(--muted)}
.it span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.wrow{display:flex;gap:8px;margin-top:10px}
.wrow input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.bal{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14px;line-height:1.4}
.bal b{display:block}
.bal p{margin:2px 0 0}
.bal p b{display:inline}
.bal.ok{background:var(--ok-soft)}
.wstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.wstats b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.wstats small{color:var(--muted);font-size:12px}

.sg-h{margin:12px 0 2px}
.sg{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:0;border-bottom:1px dashed var(--line);background:none;padding:9px 2px;color:var(--text)}
.sg span{min-width:0;display:flex;flex-direction:column;font-weight:500;overflow-wrap:anywhere;line-height:1.3}
.sg small{color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.sg em{font-style:normal;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.plate{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.plate h4{margin:0;font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.pl-q{display:flex;align-items:center;gap:4px;min-width:0}
.pl-q input{width:100%;min-width:0;padding:8px 4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);text-align:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pl-q span{font-size:12px;color:var(--muted)}
.pl-k{text-align:right;font-variant-numeric:tabular-nums}
.pl-search{width:100%;margin:12px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.mg-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mg-row span{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.mg-row small{color:var(--muted);font-size:12px}
.mg-row .link{padding:4px 0;font-size:13px}
.row-btns .btn:disabled{opacity:.5}

.up{margin-top:4px;color:var(--ok);font-weight:600}
.up b{color:var(--ok)}
.warm{font-size:12.5px;color:var(--muted);margin:-2px 0 8px;font-variant-numeric:tabular-nums}
.banner{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;font-size:14px;line-height:1.4}
.banner.ok{background:var(--ok-soft)}
.banner b{display:block;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.banner p{margin:4px 0 8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill.pr{background:var(--ok-soft);color:var(--ok)}
.restbar.cd .inner{animation:cdpulse .35s ease}
@keyframes cdpulse{40%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.restbar.cd .inner{animation:none}}
.plan-tg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-2px 0 10px}
.plan-tg input{width:18px;height:18px;accent-color:var(--accent)}
.entry.planned{opacity:.62}
.entry .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.entry-a{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.entry-a .link{padding:2px 0;font-size:13px}
.entry .chips{margin:6px 0 2px}
.rem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rem-row label{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
.rem-row label small{color:var(--muted)}
.rem-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.rem-row input[type=time]{padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:15px}
.body-card .stats{margin-top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cmp>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp small,.gal-d small{color:var(--muted);font-size:12px}
.cmp img,.gal img{width:100%;border-radius:10px;display:block;object-fit:cover;aspect-ratio:3/4;background:var(--surface-2)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.gal-d{margin-top:12px}
.ph{position:relative;display:block}
.x.sm{position:absolute;top:4px;right:4px;width:28px;height:28px;font-size:13px;background:rgba(0,0,0,.55);color:#fff}
.sum .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:380px){.day small{display:none}.tab{font-size:14px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">Bitácora<span>/</span>Gym</div>
      <div class="top-actions"><div class="sync" id="sync" data-s="local"><i></i><span id="syncTxt">Guardado en tu celular</span></div><button class="gear" type="button" id="gearBtn" aria-label="Ajustes" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-train" role="tab" data-view="train" aria-selected="true">Entrenar</button>
      <button class="tab" id="tab-food" role="tab" data-view="food" aria-selected="false">Comida</button>
      <button class="tab" id="tab-history" role="tab" data-view="history" aria-selected="false">Historial</button>
      <button class="tab" id="tab-progress" role="tab" data-view="progress" aria-selected="false">Progreso</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="view-train"></section>
  <section id="view-food" hidden></section>
  <section id="view-history" hidden></section>
  <section id="view-progress" hidden></section>
  <section id="view-settings" hidden></section>
</main>

<div class="restbar" id="restbar" aria-live="polite">
  <div class="inner">
    <div>
      <div class="t" id="restT">0:00</div>
      <div class="bar"><i id="restBar"></i></div>
    </div>
    <div class="lbl"><span id="restLbl">Descanso</span><span class="tap">Toca la barra para cerrar</span></div>
    <button type="button" data-rest="-15" aria-label="Quitar 15 segundos">−15</button>
    <button type="button" data-rest="15" aria-label="Agregar 15 segundos">+15</button>
    <button type="button" data-rest="skip" aria-label="Cerrar temporizador">✕</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
    <p id="modalMsg"></p>
    <div class="row">
      <button class="btn" type="button" id="modalNo">Cancelar</button>
      <button class="btn primary" type="button" id="modalYes">Aceptar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" multiple hidden>

<script src="js/capacitor-core.js"></script>
<script>
/* ---------- Plataforma (Android con Capacitor) ---------- */
const APP_VERSION = '1.1.0';
const CLOUD = false;
const CX = window.capacitorExports || null;
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const plug = n => (CX && IS_NATIVE) ? CX.registerPlugin(n) : null;
const LN = plug('LocalNotifications'), KA = plug('KeepAwake'), FS = plug('Filesystem'), SH = plug('Share'), APP = plug('App'), HAP = plug('Haptics'), SB = plug('StatusBar');
const RA = plug('RestAlarm');
const safe = async fn => { try { return await fn(); } catch(e){ console.warn(e); return null; } };

/* ---------- Catálogo de ejercicios ----------
   u: unidad → kg | placas (número de placa en la torre) | extra (lastre en kg; vacío = peso corporal) */
const EX_BASE = {
  'press-banca':             {name:'Press de banca con barra', u:'kg'},
  'press-banca-mancuernas':  {name:'Press de banca con mancuernas', u:'kg', note:'Anota el peso de una mancuerna.'},
  'press-pecho-maquina':     {name:'Press de pecho en máquina', u:'placas'},
  'remo-barra':              {name:'Remo con barra', u:'kg'},
  'remo-polea':              {name:'Remo en polea baja', u:'placas'},
  'remo-mancuerna':          {name:'Remo con mancuerna a una mano', u:'kg'},
  'remo-maquina':            {name:'Remo en máquina', u:'placas'},
  'press-militar':           {name:'Press militar con mancuernas sentado', u:'kg', note:'Anota el peso de una mancuerna.'},
  'press-militar-maquina':   {name:'Press militar en máquina', u:'kg', note:'Anota el peso total de la máquina.'},
  'jalon-abierto':           {name:'Jalón al pecho agarre abierto', u:'placas'},
  'jalon-neutro':            {name:'Jalón al pecho agarre neutro', u:'placas'},
  'dominadas':               {name:'Dominadas', u:'extra'},
  'lat-mancuerna':           {name:'Elevaciones laterales con mancuernas', u:'kg'},
  'lat-polea':               {name:'Elevaciones laterales en polea', u:'placas'},
  'face-pull':               {name:'Face pull en polea', u:'placas'},
  'curl-z':                  {name:'Curl con barra Z', u:'kg', note:'Barras fijas de 10, 15, 20, 25 y 30: anota el número de la barra.'},
  'curl-mancuernas':         {name:'Curl con mancuernas', u:'kg'},
  'curl-polea':              {name:'Curl en polea', u:'placas'},
  'curl-martillo':           {name:'Curl martillo con mancuernas', u:'kg'},
  'curl-martillo-cuerda':    {name:'Curl martillo en polea con cuerda', u:'placas'},
  'triceps-cuerda':          {name:'Extensión de tríceps en polea con cuerda', u:'placas'},
  'triceps-barra-polea':     {name:'Extensión de tríceps en polea con barra', u:'placas'},
  'triceps-overhead':        {name:'Extensión de tríceps sobre la cabeza en polea', u:'placas'},
  'press-frances':           {name:'Press francés con barra Z', u:'kg', note:'Barras fijas de 10, 15, 20, 25 y 30: anota el número de la barra.'},
  'press-inclinado':         {name:'Press inclinado con mancuernas', u:'kg', note:'Anota el peso de una mancuerna.'},
  'press-inclinado-barra':   {name:'Press inclinado con barra', u:'kg'},
  'press-inclinado-maquina': {name:'Press inclinado en máquina', u:'placas'},
  'sentadilla':              {name:'Sentadilla libre', u:'kg'},
  'hack':                    {name:'Sentadilla en máquina Hack', u:'kg'},
  'sentadilla-smith':        {name:'Sentadilla en máquina Smith', u:'kg'},
  'prensa':                  {name:'Prensa inclinada', u:'kg'},
  'rumano-mancuernas':       {name:'Peso muerto rumano con mancuernas', u:'kg', note:'Anota el peso de una mancuerna.'},
  'rumano-barra':            {name:'Peso muerto rumano con barra', u:'kg'},
  'curl-fem-acostado':       {name:'Curl femoral acostado', u:'placas'},
  'curl-fem-sentado':        {name:'Curl femoral sentado', u:'placas'},
  'pantorrilla-pie':         {name:'Elevación de pantorrillas de pie', u:'placas'},
  'pantorrilla-sentado':     {name:'Elevación de pantorrillas sentado', u:'kg'},
  'pantorrilla-prensa':      {name:'Pantorrillas en prensa', u:'kg'},
  'bulgara':                 {name:'Sentadilla búlgara (por pierna)', u:'kg', note:'Anota el peso de una mancuerna.'},
  'zancadas':                {name:'Zancadas (por pierna)', u:'kg', note:'Anota el peso de una mancuerna.'},
  'piernas-colgado':         {name:'Elevación de piernas colgado', u:'extra'},
  'crunch-inverso':          {name:'Crunch inverso en banco', u:'extra'},
  'crunch-polea':            {name:'Crunch en polea alta con cuerda', u:'placas'},
  'crunch-maquina':          {name:'Crunch en máquina', u:'placas'}
};
let EX = Object.assign({}, EX_BASE);
const UNITS = {
  kg:     {head:'Peso (kg)',   ph:'kg',     step:'0.5', im:'decimal', chip:'kg'},
  placas: {head:'Placas',      ph:'placa',  step:'1',   im:'numeric', chip:'placas'},
  extra:  {head:'Lastre (kg)', ph:'PC',     step:'0.5', im:'decimal', chip:'peso corporal'}
};
const exInfo = id => EX[id] || {name: id, u:'kg'};

/* ---------- Rutina: cada lugar acepta variantes ---------- */
const DEFAULT_DAYS = [
  {id:'TA', name:'Torso A', tag:'Lunes', slots:[
    [4,'8-10',90,  ['press-banca','press-banca-mancuernas','press-pecho-maquina']],
    [4,'8-10',90,  ['remo-barra','remo-polea','remo-mancuerna','remo-maquina']],
    [3,'10-12',90, ['press-militar','press-militar-maquina']],
    [3,'10-12',60, ['jalon-abierto','jalon-neutro']],
    [3,'12-15',60, ['lat-mancuerna','lat-polea']],
    [3,'12-15',60, ['curl-z','curl-mancuernas','curl-polea']],
    [3,'12-15',60, ['triceps-cuerda','triceps-barra-polea']]]},
  {id:'PA', name:'Pierna A', tag:'Martes', slots:[
    [4,'8-10',120, ['sentadilla','hack','sentadilla-smith']],
    [3,'10-12',90, ['prensa']],
    [3,'10-12',90, ['rumano-mancuernas','rumano-barra']],
    [3,'10-12',60, ['curl-fem-acostado','curl-fem-sentado']],
    [4,'15-20',60, ['pantorrilla-pie','pantorrilla-sentado','pantorrilla-prensa']],
    [3,'al fallo',60, ['piernas-colgado','crunch-inverso']]]},
  {id:'TB', name:'Torso B', tag:'Jueves', slots:[
    [4,'8-10',90,  ['press-inclinado','press-inclinado-barra','press-inclinado-maquina']],
    [4,'8-10',90,  ['remo-polea','remo-mancuerna','remo-maquina','remo-barra']],
    [3,'8-12',90,  ['jalon-neutro','dominadas','jalon-abierto']],
    [3,'12-15',60, ['lat-polea','lat-mancuerna']],
    [3,'15',60,    ['face-pull']],
    [3,'12-15',60, ['curl-martillo','curl-martillo-cuerda']],
    [3,'12-15',60, ['triceps-overhead','press-frances']]]},
  {id:'PB', name:'Pierna B', tag:'Viernes', slots:[
    [4,'8-10',120, ['rumano-barra','rumano-mancuernas']],
    [3,'10-12',90, ['hack','sentadilla','sentadilla-smith']],
    [3,'10-12',90, ['bulgara','zancadas']],
    [3,'10-12',60, ['curl-fem-sentado','curl-fem-acostado']],
    [4,'15-20',60, ['pantorrilla-sentado','pantorrilla-pie','pantorrilla-prensa']],
    [3,'12-15',60, ['crunch-polea','crunch-maquina']]]}
];
/* Una rutina importada usa el mismo formato: {type:'bitacora-rutina', name, exercises:{id:{name,u,note}}, days:[{id,name,tag,slots:[{sets,reps,rest,vars}]}]} */
const toDay = d => ({id: String(d.id), name: String(d.name || d.id), tag: String(d.tag || ''), slots: (d.slots || []).map((sl, i) => Array.isArray(sl)
  ? {key: d.id + i, sets: sl[0], reps: String(sl[1]), rest: sl[2], vars: sl[3]}
  : {key: d.id + i, sets: Math.max(1, Math.min(10, Math.round(+sl.sets) || 3)), reps: String(sl.reps ?? '10'), rest: Math.max(15, Math.min(600, Math.round(+sl.rest) || 90)), vars: (sl.vars || []).map(String).filter(Boolean)}
).filter(sl => sl.vars && sl.vars.length)});
const DEFAULT_NAME = 'Torso / Pierna 4 días';
let ROUTINE = DEFAULT_DAYS.map(toDay), ORDER = ROUTINE.map(d => d.id), ROUTINE_NAME = DEFAULT_NAME;
function applyRoutine(r){
  EX = Object.assign({}, EX_BASE);
  if (r && r.exercises && typeof r.exercises === 'object') Object.entries(r.exercises).forEach(([id, e]) => {
    if (e && e.name) EX[String(id)] = {name: String(e.name).slice(0, 80), u: ['kg','placas','extra'].includes(e.u) ? e.u : 'kg', note: e.note ? String(e.note).slice(0, 200) : undefined};
  });
  const days = r && Array.isArray(r.days) ? r.days.map(toDay).filter(d => d.slots.length) : [];
  ROUTINE = days.length ? days : DEFAULT_DAYS.map(toDay);
  ORDER = ROUTINE.map(d => d.id);
  ROUTINE_NAME = (days.length && r.name) ? String(r.name).slice(0, 60) : DEFAULT_NAME;
}
function validRoutine(r){ return r && r.type === 'bitacora-rutina' && Array.isArray(r.days) && r.days.map(toDay).filter(d => d.slots.length).length > 0; }
const dayById = id => ROUTINE.find(d => d.id === id) || ROUTINE[0];
const slotByKey = k => { for (const d of ROUTINE) for (const s of d.slots) if (s.key === k) return s; return null; };

/* ---------- Estado ---------- */
const KEY = 'bitacora-gym.v3', OLD = 'bitacora-gym.v2';
function loadLocal(){
  try {
    const v3 = JSON.parse(localStorage.getItem(KEY));
    if (v3) return v3;
    const v2 = JSON.parse(localStorage.getItem(OLD));
    if (v2) return {local: v2.local || [], pending: v2.pending || []};
  } catch(e){}
  return {};
}
const S = Object.assign({draft: null, local: [], pending: [], pref: {}}, loadLocal());
if (!Array.isArray(S.local)) S.local = [];
if (!Array.isArray(S.pending)) S.pending = [];
if (!S.pref || typeof S.pref !== 'object') S.pref = {};
if (S.draft && !S.draft.slots) S.draft = null;
if (S.routine) applyRoutine(S.routine);
if (S.draft && !ORDER.includes(S.draft.day)) S.draft = null;
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

let dbState = 'loading', remote = [], col = null, downloads = null, view = 'train';

function history(){
  const map = new Map();
  (dbState === 'cloud' ? remote : S.local).forEach(h => map.set(h.id, h));
  S.pending.forEach(h => map.set(h.id, Object.assign({}, h, {_pending: true})));
  return [...map.values()].sort((a,b) => a.date - b.date);
}

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
function clock(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
function mins(sec){ const m = Math.round(sec/60); return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; }
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : null; };
function fmtW(w, u){
  if (w == null || (u === 'extra' && !w)) return u === 'extra' ? 'PC' : '–';
  const n = (Math.round(w*10)/10).toString();
  return u === 'placas' ? n + ' pl' : u === 'extra' ? '+' + n : n;
}
const fmtSet = (s, u) => `${fmtW(s.w, u)}×${s.r ?? '–'}`;
const dShort = ts => new Date(ts).toLocaleDateString('es-MX', {day:'numeric', month:'short'});
const dLong = ts => new Date(ts).toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'});
const tHM = ts => new Date(ts).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let modalResolve = null;
function ask(msg, yes = 'Aceptar', danger = false){
  return new Promise(res => {
    if (modalResolve) modalResolve(false);
    modalResolve = res;
    $('#modalMsg').textContent = msg;
    const y = $('#modalYes'); y.textContent = yes;
    y.style.background = danger ? 'var(--danger)' : ''; y.style.borderColor = danger ? 'var(--danger)' : '';
    $('#modal').hidden = false; y.focus();
  });
}
function closeModal(v){ $('#modal').hidden = true; const r = modalResolve; modalResolve = null; if (r) r(v); }
$('#modalYes').addEventListener('click', () => closeModal(true));
$('#modalNo').addEventListener('click', () => closeModal(false));
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(false); });

let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

function suggestedDay(){
  const h = history(); const last = h[h.length-1];
  if (!last) return 'TA';
  return ORDER[(ORDER.indexOf(last.day) + 1) % ORDER.length];
}
function preferredVariant(sl){
  if (sl.vars.includes(S.pref[sl.key])) return S.pref[sl.key];
  const h = history();
  for (let i = h.length-1; i >= 0; i--) for (const v of sl.vars) if (h[i].sets && h[i].sets[v]) return v;
  return sl.vars[0];
}
const emptySets = n => Array.from({length: n}, () => ({w:'', r:'', done:false}));
/* ---- Progresión, récords, calentamiento y semana de descarga ---- */
const repsTop = reps => { const m = String(reps).match(/(\d+)\s*$/); return m ? +m[1] : null; };
function incFor(exId, dayId){
  const ex = exInfo(exId), note = ex.note || '';
  if (ex.u === 'placas') return 1;
  if (ex.u === 'extra') return 2.5;
  if (/barras fijas/i.test(note)) return 5;
  if (/una mancuerna/i.test(note)) return 2;
  return /^P/.test(dayId) ? 5 : 2.5;
}
function progressHint(sl, exId, prev, dayId){
  if (!prev) return null;
  const top = repsTop(sl.reps); if (!top) return null;
  const sets = prev.sets.filter(s => s.r != null);
  if (sets.length < sl.sets) return null;
  const w = Math.max(...sets.map(s => s.w || 0));
  if (sets.filter(s => (s.w || 0) === w && s.r >= top).length < sl.sets) return null;
  return {from: w, to: Math.round((w + incFor(exId, dayId)) * 10) / 10, top};
}
const e1rm = s => (s.w || 0) * (1 + (s.r || 0) / 30);
function bestE1rm(exId){
  let best = 0;
  history().forEach(h => (h.sets && h.sets[exId] || []).forEach(s => { const v = e1rm(s); if (v > best) best = v; }));
  return best;
}
const roundTo = (v, step) => Math.max(0, Math.round(v / step) * step);
function warmupHTML(exId, w){
  const ex = exInfo(exId);
  if (ex.u !== 'kg' || !w || w < 20) return '';
  const step = /una mancuerna/i.test(ex.note || '') ? 1 : 2.5;
  return `<div class="warm">Calentamiento (no se anota): ${[[0.4, 10], [0.6, 6], [0.8, 3]].map(([p, r]) => `${roundTo(w * p, step)}×${r}`).join(' · ')}</div>`;
}
const isDeload = () => !!(S.deloadUntil && S.deloadUntil > Date.now());
function cycleInfo(){
  if (S.deloadUntil && S.deloadUntil <= Date.now()){ S.cycleStart = S.deloadUntil; S.deloadUntil = null; S.deloadSnooze = null; saveLocal(); }
  const h = history(); if (!h.length) return null;
  const start = S.cycleStart || h[0].date;
  return {week: Math.floor((Date.now() - start) / (7 * 864e5)) + 1, deload: isDeload()};
}
function cycleBanner(){
  const cy = cycleInfo(); if (!cy) return '';
  if (cy.deload) return `<div class="banner ok"><b>Semana de descarga</b><p>Hasta el ${dShort(S.deloadUntil)}: la mitad de las series y ~10% menos peso; ya viene precargado. Entrena suave y enfócate en la técnica.</p><button class="link" type="button" data-cycle="end">Terminar la descarga</button></div>`;
  if (cy.week >= 8 && !(S.deloadSnooze && S.deloadSnooze > Date.now())) return `<div class="banner"><b>Semana ${cy.week}: toca descarga</b><p>Una semana ligera (mitad de series y ~10% menos peso) te ayuda a recuperarte y regresar más fuerte.</p><div class="row-btns"><button class="btn" type="button" data-cycle="snooze">Ahora no</button><button class="btn primary" type="button" data-cycle="start">Activar esta semana</button></div></div>`;
  return '';
}
function newDraft(dayId){
  const d = dayById(dayId), slots = {};
  d.slots.forEach(sl => slots[sl.key] = {v: preferredVariant(sl), sets: emptySets(isDeload() ? Math.max(1, Math.ceil(sl.sets / 2)) : sl.sets)});
  return {day: d.id, start: null, slots, notes: '', auto: true};
}
function lastFor(exId){
  const h = history();
  for (let i = h.length-1; i >= 0; i--){
    const s = h[i].sets && h[i].sets[exId];
    if (s && s.length) return {date: h[i].date, sets: s};
  }
  return null;
}

async function flushPending(){
  if (!col || flushing || !S.pending.length) return;

    while (S.pending.length){
      const h = S.pending[0];
      const body = {day: h.day, date: h.date, end: h.end || h.date, duration: h.duration || 0, sets: h.sets, notes: h.notes || ''};
      let ok = false;
      for (let attempt = 0; attempt < 2 && !ok; attempt++){
        try { await col.doc(h.id).set(body); ok = true; }
        catch(e){

/* ---------- Gemini (cálculo de comida) ---------- */
const GEM_BASE = 'https://generativelanguage.googleapis.com/v1beta';
const geminiKey = () => (S.gemini && S.gemini.key) || '';
async function gemFetch(path, opts = {}){
  const r = await fetch(GEM_BASE + path, Object.assign({}, opts, {headers: {'Content-Type': 'application/json', 'x-goog-api-key': geminiKey()}}));
  let data = null; try { data = await r.json(); } catch(_){}
  if (!r.ok) throw {status: r.status, message: (data && data.error && data.error.message) || ('HTTP ' + r.status)};
  return data;
}
async function detectModels(){
  const d = await gemFetch('/models?pageSize=200');
  const names = (d && d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => String(m.name || '').replace(/^models\//, ''))
    .filter(n => /gemini/.test(n) && /flash/.test(n) && !/(tts|image|audio|live|embedding|thinking|exp|native|computer|robotics)/.test(n));
  const ver = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? +m[1] : 0; };
  const score = n => ver(n) * 10 + (/lite/.test(n) ? 3 : 0) - (/preview/.test(n) ? 6 : 0) - (/-\d{3,}$/.test(n) ? 1 : 0);
  return [...new Set(names)].sort((a, b) => score(b) - score(a));
}
function mapGem(e){
  if (!e) return {code: 'upstream_error'};
  if (e.code) return e;
  if (e.name === 'AbortError') return {code: 'cancelled'};
  if (e.status === 429) return {code: 'rate_limited'};
  if (e.status === 401 || e.status === 403 || (e.status === 400 && /api.?key/i.test(e.message || ''))) return {code: 'bad_key'};
  return {code: 'upstream_error', message: e.message};
}
const gemini = {
  async json(prompt, opts = {}){
    if (!geminiKey()) throw {code: 'not_granted'};
    if (!S.gemini.model){
      try { S.gemini.models = await detectModels(); S.gemini.model = S.gemini.models[0] || ''; saveLocal(); } catch(e){ throw mapGem(e); }
      if (!S.gemini.model) throw {code: 'upstream_error', message: 'Sin modelos disponibles'};
    }
    const run = async model => {
      const body = {contents: [{role: 'user', parts: [{text: prompt}]}], generationConfig: {responseMimeType: 'application/json', temperature: 0.2}};
      const d = await gemFetch(`/models/${encodeURIComponent(model)}:generateContent`, {method: 'POST', body: JSON.stringify(body), signal: opts.signal});
      const txt = ((((d && d.candidates || [])[0] || {}).content || {}).parts || []).map(p => p.text || '').join('');
      if (!txt.trim()) throw {code: 'empty_completion'};
      const m = txt.match(/[\[{][\s\S]*[\]}]/);
      try { return JSON.parse(m ? m[0] : txt); } catch(_){ throw {code: 'invalid_json'}; }
    };
    try { return await run(S.gemini.model); }
    catch(e){
      if (opts.signal && opts.signal.aborted) throw {code: 'cancelled'};
      if (e && (e.status === 404 || e.status === 429)){
        const alt = (S.gemini.models || []).find(n => n !== S.gemini.model);
        if (alt){
          try { const out = await run(alt); if (e.status === 404){ S.gemini.model = alt; saveLocal(); } return out; }
          catch(e2){ throw mapGem(e2); }
        }
      }
      throw mapGem(e);
    }
  }
};

  let html = `<div class="days">` + ROUTINE.map(d => `

    const wPh = p => { if (!p || p.w == null) return U.ph; if (hint) return hint.to; if (isDeload() && ex.u !== 'extra') return roundTo(p.w * 0.9, ex.u === 'placas' ? 1 : 2.5); return p.w; };

      : `<div class="prev">${dbState === 'loading' ? 'Cargando tu historial…' : 'Sin registros de este ejercicio. Elige un peso que te deje en el rango con 1-2 reps en reserva.'}</div>`;

function startSession(){
  if (!S.draft.start){ S.draft.start = Date.now(); S.draft.auto = false; saveLocal(); requestWake(); }

async function finishSession(){
  const D = S.draft, sets = {};
  let count = 0;
  for (const st of Object.values(D.slots)){
    const clean = st.sets.filter(s => s.w !== '' || s.r !== '').map(s => ({w: num(s.w), r: num(s.r)}));
    if (clean.length){ sets[st.v] = (sets[st.v] || []).concat(clean); count += clean.length; }
  }
  if (!count){ toast('Todavía no registras ninguna serie.'); return; }
  const dur = D.start ? Math.round((Date.now() - D.start)/1000) : 0;
  const ok = await ask(`¿Guardar ${dayById(D.day).name} con ${count} series${dur ? ' y ' + mins(dur) : ''}?`, 'Guardar');
  if (!ok) return;
  const prs = [];
  Object.entries(sets).forEach(([exId, arr]) => {
    const best = bestE1rm(exId), top = arr.reduce((b, x) => e1rm(x) > e1rm(b) ? x : b, arr[0]);
    if (best > 0 && e1rm(top) > best + 0.01) prs.push({ex: exId, w: top.w, r: top.r});
  });
  const rec = {id: uid(), day: D.day, date: D.start || Date.now(), end: Date.now(), duration: dur, sets, notes: D.notes || '', prs, deload: isDeload() || undefined};
  if (dbState === 'local') S.local.push(rec); else S.pending.push(rec);
  S.draft = null; stopRest(); releaseWake(); saveLocal(); setStatus();
  flushPending();
  toast(prs.length ? `Sesión guardada · ${prs.length} ${prs.length === 1 ? 'récord' : 'récords'} nuevo${prs.length === 1 ? '' : 's'}` : 'Sesión guardada');
  renderTrain(); switchView('history');
}

$('#view-train').addEventListener('click', async e => {

      if (s.r === '' && /^\d+$/.test(rIn.placeholder)){ s.r = rIn.placeholder; rIn.value = s.r; }
      const best = bestE1rm(st.v), val = e1rm({w: num(s.w), r: num(s.r)});
      S.draft.prs = S.draft.prs || {};

        S.draft.prs[st.v] = val;

        if (HAP) safe(() => HAP.vibrate({duration: 120}));

      const wasStarted = !!S.draft.start;

      const isLast = i === rows.length - 1;

    }

    if (r2){ r2.classList.toggle('done', s.done); r2.querySelector('.check').setAttribute('aria-pressed', s.done); }
    const c2 = document.querySelector(`.card[data-slot="${key}"]`);

    updateProgress();
    return;
  }

  if (act === 'add'){ const last = rows[rows.length-1] || {}; rows.push({w: last.w || '', r: '', done:false}); S.draft.auto = false; saveLocal(); renderTrain(); }
  if (act === 'del'){ rows.pop(); saveLocal(); renderTrain(); }
  if (act === 'rest'){ unlockAudio(); startRest(sl.rest, exInfo(st.v).name); }
});

let rest = null;
const REST_NID = 7001;

async function scheduleRestNotif(){

  await safe(() => RA.schedule({at: rest.end}));

function startRest(sec, label){ rest = {end: Date.now() + sec*1000, total: sec, label, beeped: false}; $('#restbar').classList.add('show'); $('#restbar').classList.remove('over'); saveRest(); scheduleRestNotif(); tick(); }
function stopRest(){ const had = !!rest; rest = null; $('#restbar').classList.remove('show','over'); if (had) saveRest(); if (RA) safe(() => RA.cancel()); }
function onRestTap(e){

let actx = null;
function unlockAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){} }
function beep(){
  if (RA) return; // la alarma nativa ya suena y vibra a la hora exacta
  if (HAP) safe(() => HAP.vibrate({duration: 450}));
  try {
    if (actx){
      [0, .28, .56].forEach(off => {
        const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + off;
        o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.35, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .2);
        o.start(t0); o.stop(t0 + .22);
      });
    }
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([250,120,250]); } catch(e){}
}

let wake = null;
async function requestWake(){ if (KA){ await safe(() => KA.keepAwake()); return; } try { if ('wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); } catch(e){} }
function releaseWake(){ if (KA){ safe(() => KA.allowSleep()); return; } try { wake && wake.release(); } catch(e){} wake = null; }
document.addEventListener('visibilitychange', () => {

function countdownTick(){
  const bar = $('#restbar'); bar.classList.remove('cd'); void bar.offsetWidth; bar.classList.add('cd');
  if (document.visibilityState !== 'visible') return;
  if (RA){ safe(() => RA.tick()); return; }
  if (HAP) safe(() => HAP.vibrate({duration: 60}));
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime;
    o.type = 'sine'; o.frequency.value = 660; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.25, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + .09);
    o.start(t0); o.stop(t0 + .1);
  } catch(e){}
}
function tick(){
  const sc = $('#sessClock');
  if (sc && S.draft && S.draft.start) sc.textContent = clock((Date.now() - S.draft.start)/1000);
  if (rest){
    const left = (rest.end - Date.now())/1000;
    $('#restLbl').textContent = left > 0 ? `Descanso · ${rest.label}` : `¡A darle! · ${rest.label}`;
    $('#restT').textContent = left > 0 ? clock(Math.ceil(left)) : '+' + clock(-left);
    $('#restBar').style.width = Math.min(100, Math.max(0, 100 - left/rest.total*100)) + '%';
    const sec = Math.ceil(left);
    if (left > 0 && sec <= 3 && rest.cd !== sec){ rest.cd = sec; countdownTick(); }
    if (left <= 0 && !rest.beeped){ rest.beeped = true; $('#restbar').classList.add('over'); beep(); }
    if (left < -20) stopRest();
  }
}

/* ---------- Historial ---------- */
function volumeOf(h){ let v = 0; for (const [id, a] of Object.entries(h.sets)) if (exInfo(id).u === 'kg') for (const s of a) v += (s.w||0)*(s.r||0); return Math.round(v); }
let sumWeek = 0;
function weekRange(offset){
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow - offset * 7);
  const start = dk(d), end = dkShift(start, 6);
  return {start, end, t0: dkParse(start).getTime(), t1: dkParse(end).getTime() + 864e5};
}
function weekSummary(offset){
  const w = weekRange(offset), prev = weekRange(offset + 1);
  const ses = history().filter(h => h.date >= w.t0 && h.date < w.t1);
  const timed = ses.filter(h => h.duration);
  const prs = ses.flatMap(h => h.prs || []);
  const days = Object.values(S.food.days || {}).filter(d => d.date >= w.start && d.date <= w.end);
  const T = S.food.profile && S.food.profile.targets;
  const logged = days.filter(d => (d.entries || []).some(e => !e.planned));
  const kc = logged.map(d => totals(d).kcal), pr = logged.map(d => totals(d).p);
  const avg = a => a.length ? a.reduce((x, v) => x + v, 0) / a.length : null;
  const inRange = (r, f) => Object.values(S.food.days || {}).filter(d => d[f] != null && d.date >= r.start && d.date <= r.end).map(d => +d[f]);
  const wt = avg(inRange(w, 'weight')), wtPrev = avg(inRange(prev, 'weight'));
  const st = inRange(w, 'steps');
  const wa = inRange(w, 'waist'), waPrev = inRange(prev, 'waist');
  return {w, ses: ses.length, target: ORDER.length, dur: timed.length ? avg(timed.map(h => h.duration)) / 60 : null, prs,
    logged: logged.length, kcal: avg(kc), kcalT: T && T.kcal, protOk: T ? pr.filter(p => p >= T.p).length : null, protT: T && T.p,
    wt, wtDiff: wt != null && wtPrev != null ? wt - wtPrev : null, steps: avg(st), stepsN: st.length, stepsOk: st.filter(v => v >= STEP_GOAL).length,
    waist: wa.length ? wa[wa.length - 1] : null, waistDiff: wa.length && waPrev.length ? wa[wa.length - 1] - waPrev[waPrev.length - 1] : null};
}
const sgn = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v * 10 ** d) / 10 ** d);
function weekRangeLabel(w){ return `${dShort(dkParse(w.start))} – ${dShort(dkParse(w.end))}`; }
function summaryText(m){
  const L = [`Resumen Bitácora Gym · semana ${weekRangeLabel(m.w)}`];
  L.push(`Entrenamientos: ${m.ses} de ${m.target}${m.dur ? ` (prom. ${Math.round(m.dur)} min)` : ''}.${m.prs.length ? ' Récords: ' + m.prs.map(p => `${exInfo(p.ex).name} ${fmtSet(p, exInfo(p.ex).u)}`).join(', ') + '.' : ''}`);
  if (m.logged) L.push(`Comida: ${m.logged} días registrados, prom. ${r0(m.kcal).toLocaleString('es-MX')} kcal${m.kcalT ? ` (meta ${m.kcalT.toLocaleString('es-MX')})` : ''}; proteína cumplida ${m.protOk} de ${m.logged} días${m.protT ? ` (meta ${m.protT} g)` : ''}.`);
  if (m.wt != null) L.push(`Peso: ${m.wt.toFixed(1)} kg prom.${m.wtDiff != null ? ` (${sgn(m.wtDiff)} kg vs semana anterior)` : ''}.`);
  if (m.stepsN) L.push(`Pasos: ${r0(m.steps).toLocaleString('es-MX')} prom., ${m.stepsOk} de ${m.stepsN} días con ${STEP_GOAL.toLocaleString('es-MX')}+.`);
  return L.join('\n');
}
function summaryHTML(){

  }

    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch(e){ toast('No se pudo generar el archivo.'); }
}

function resizeImage(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

function chartSvg(pts, u){
  const W = 640, H = 250, L = 44, R = 18, T = 34, B = 30;
  const ys = pts.flatMap(p => [p.top.w||0, p.e1rm]);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (max === min){ max += 5; min = Math.max(0, min - 5); }
  const padY = (max - min) * .12; min = Math.max(0, min - padY); max += padY;
  const x = i => pts.length === 1 ? (L + W - R)/2 : L + i*(W - L - R)/(pts.length - 1);
  const y = v => T + (1 - (v - min)/(max - min))*(H - T - B);
  const line = key => pts.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(key(p)).toFixed(1)}`).join(' ');
  const area = `${line(p => p.top.w||0)} L${x(pts.length-1).toFixed(1)},${H-B} L${x(0).toFixed(1)},${H-B} Z`;
  let g = '';
  for (let k = 0; k <= 4; k++){
    const v = min + (max - min)*k/4, yy = y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${L-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`;
  }
  const labIdx = pts.length <= 6 ? pts.map((_,i) => i) : [0, Math.floor((pts.length-1)/2), pts.length-1];
  labIdx.forEach(i => g += `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${pts.length > 1 && i === 0 ? 'start' : pts.length > 1 && i === pts.length-1 ? 'end' : 'middle'}" font-size="11" fill="var(--muted)">${dShort(pts[i].date)}</text>`);
  const lx = pts.length - 1;
  const uLbl = u === 'placas' ? 'placas' : 'kg';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progreso del ejercicio">
    ${g}
    <path d="${area}" fill="var(--accent)" fill-opacity=".1" stroke="none"/>
    <path d="${line(p => p.e1rm)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="${line(p => p.top.w||0)}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.top.w||0).toFixed(1)}" r="${i === lx ? 6 : 4}" fill="${i === lx ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2.5"/>`).join('')}
    <g font-size="11" fill="var(--muted)">
      <rect x="${L}" y="8" width="16" height="3" fill="var(--accent)"/><text x="${L+22}" y="13">Top set (${uLbl})</text>
      <rect x="${L+150}" y="8" width="16" height="3" fill="var(--muted)"/><text x="${L+172}" y="13">1RM estimado</text>
    </g>
  </svg>`;
}

function calcTargets(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex === 'm' ? -161 : 5);
  const tdee = bmr * (ACT[p.act] || ACT.sed).f;
  let kcal = tdee * (GOALS[p.goal] || GOALS.bajar).mult;
  if (p.goal === 'bajar') kcal = Math.max(kcal, bmr, p.sex === 'm' ? 1200 : 1500);
  kcal = Math.round(kcal / 50) * 50;
  const prot = Math.min(Math.round((p.goal === 'bajar' ? 2 : 1.8) * p.weight), 220);
  const fat = Math.round(kcal * 0.27 / 9);
  const carb = Math.max(50, Math.round((kcal - prot*4 - fat*9) / 4));
  return {kcal, p: prot, c: carb, f: fat, tdee: Math.round(tdee), bmr: Math.round(bmr)};
}

  daysCol.where('date', '>=', dkShift(dk(Date.now()), -120)).onSnapshot(snap => {
    snap.docs.forEach(d => { if (d.exists && !S.food.dirty[d.id]) S.food.days[d.id] = Object.assign({date: d.id, entries: [], weight: null}, d.data()); });
    saveLocal(); onData();
  }, () => {});
  flushFood();
}

/* ---- Balance semanal: sugiere cómo cuadrar si te pasaste, sin cambiar la meta normal ---- */
const r50 = n => Math.round(n / 50) * 50;
function weekBalance(today){
  const T = S.food.profile.targets; let bal = 0, n = 0;
  for (let i = 1; i <= 7; i++){
    const d = S.food.days[dkShift(today, -i)];
    if (d && (d.entries || []).length){ bal += totals(d).kcal - T.kcal; n++; }
  }
  return {bal, n};
}
function compPlan(excess){
  const P = S.food.profile, T = P.targets;
  const floor = Math.max(T.bmr || 0, P.sex === 'm' ? 1200 : 1500);
  const maxCut = Math.max(0, Math.min(300, T.kcal - floor));
  if (excess < 150 || maxCut < 100) return null;
  const days = Math.min(4, Math.ceil(excess / maxCut));
  const cut = Math.min(maxCut, Math.max(100, r50(excess / days)));
  const kcal = T.kcal - cut, p = T.p;
  const f = Math.max(40, Math.round(T.f - cut * 0.35 / 9));
  const c = Math.max(50, Math.round((kcal - p * 4 - f * 9) / 4));
  return {days, cut, kcal, p, c, f};
}
function balanceHTML(day, tot){
  const P = S.food.profile; if (!P || !P.targets) return '';
  const today = dk(Date.now()); if (day !== today) return '';
  const T = P.targets, wb = weekBalance(today), fmt = n => r0(n).toLocaleString('es-MX');
  const macros = pl => `proteína ${pl.p} g · carbos ${pl.c} g · grasa ${pl.f} g`;
  const todayOver = tot.kcal - T.kcal;
  if (todayOver > 150){
    const pl = compPlan(Math.max(0, wb.bal) + todayOver);
    if (!pl) return '';
    return `<div class="bal"><b>Hoy vas ${fmt(todayOver)} kcal arriba</b><p>No pasa nada. Para cuadrarlo, ${pl.days === 1 ? 'mañana' : `los próximos ${pl.days} días`} apunta a <b>${fmt(pl.kcal)} kcal</b> (${macros(pl)}). Tu meta normal no cambia.</p></div>`;
  }
  if (wb.bal > 150){
    const pl = compPlan(wb.bal);
    if (!pl) return '';
    const left = pl.kcal - tot.kcal;
    return `<div class="bal"><b>Para cuadrar la semana</b><p>En los últimos días llevas ${fmt(wb.bal)} kcal arriba. Hoy te sugiero <b>${fmt(pl.kcal)} kcal</b> (${macros(pl)})${pl.days > 1 ? ` y lo mismo ${pl.days - 1 === 1 ? 'mañana' : `${pl.days - 1} días más`}` : ''}. ${left > 0 ? `Con la sugerencia te quedan ${fmt(left)} kcal.` : 'Con lo que llevas ya estás en la sugerencia.'}</p></div>`;
  }
  if (wb.bal < -500){
    return `<div class="bal ok"><b>Vas por debajo esta semana</b><p>Llevas ${fmt(-wb.bal)} kcal menos que tu meta en los últimos días. Come tu meta normal; no te conviene recortar más.</p></div>`;
  }
  return '';
}

function weightTrend(){
  const pts = Object.values(S.food.days).filter(d => d.weight).map(d => ({k: d.date, w: +d.weight})).sort((a,b) => a.k < b.k ? -1 : 1);
  if (!pts.length) return null;
  const today = dk(Date.now());
  const inRange = (from, to) => pts.filter(p => p.k > from && p.k <= to);
  const cur = inRange(dkShift(today, -7), today), prev = inRange(dkShift(today, -14), dkShift(today, -7));
  const avg = a => a.reduce((s,p) => s + p.w, 0) / a.length;
  return {last: pts[pts.length-1], avg: cur.length ? avg(cur) : null, prevAvg: prev.length ? avg(prev) : null, n: cur.length};
}

const STEP_GOAL = 10000;
function stepsAvg(){
  const today = dk(Date.now()), from = dkShift(today, -7);
  const a = Object.values(S.food.days).filter(d => d.steps != null && d.date > from && d.date <= today);
  if (!a.length) return null;
  return {avg: Math.round(a.reduce((s,d) => s + (+d.steps || 0), 0) / a.length), n: a.length, hit: a.filter(d => d.steps >= STEP_GOAL).length};
}

function recents(){
  const seen = new Set(), out = [];
  Object.values(S.food.days).sort((a,b) => a.date < b.date ? 1 : -1).forEach(d =>

      if (key && !seen.has(key) && out.length < 8){ seen.add(key); out.push(e); }
    }));
  return out;
}

/* ---- Biblioteca de alimentos, frecuentes y buscador ---- */
function saveNut(){ if (CLOUD) S.food.dirty._profile = true; saveLocal(); setStatus(); flushFood(); }
const norm = x => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const STOP = new Set(['de','del','con','y','la','el','los','las','un','una','unos','unas','medio','media','gr','grs','gramos','ml','pieza','piezas','pz','sin','en','al','mi','para']);
const words = q => norm(q).split(/[^a-z0-9]+/).filter(w => w.length > 1 && !/^\d/.test(w) && !STOP.has(w));
const UNIT_LBL = {g: '100 g', pz: 'pieza', por: 'porción'};
function parseQty(q){
  const x = norm(q).replace(/(\d),(\d)/g, '$1.$2');
  const n1 = v => v.includes('/') ? (+v.split('/')[0]) / (+v.split('/')[1] || 1) : +v;
  const mP = x.match(/(\d+\/\d+|\d+(?:\.\d+)?)\s*(piezas?|pzas?|pzs?|unidad(?:es)?|rebanadas?|tortillas?|huevos?|tostadas?|tacos?|galletas?|vasos?|tazas?|latas?|sobres?|scoops?|medidas?)\b/);
  if (mP) return {unit: 'pz', n: n1(mP[1])};
  const mG = x.match(/(\d+(?:\.\d+)?)\s*(g|gr|grs|gramos|ml)\b/);
  if (mG) return {unit: 'g', n: +mG[1]};
  return null;
}
function fmtQty(u, n){ const x = Math.round(n * 100) / 100; return u === 'g' ? `${x} g` : u === 'pz' ? `${x} ${x === 1 ? 'pieza' : 'piezas'}` : (x === 1 ? '1 porción' : `${x} porciones`); }
function library(){
  const lib = {}, hid = new Set(S.food.hidden || []);
  Object.values(S.food.days).sort((a,b) => a.date < b.date ? -1 : 1).forEach(d => (d.entries || []).forEach(e => (e.items || []).forEach(i => {
    const key = norm(i.name); if (!key || hid.has(key)) return;
    const q = parseQty(i.qty) || {unit: 'por', n: 1};
    if (!(q.n > 0)) return;
    const k = (q.unit === 'g' ? 100 : 1) / q.n;
    lib[key] = {key, name: i.name, unit: q.unit, kcal: (+i.kcal||0)*k, p: (+i.p||0)*k, c: (+i.c||0)*k, f: (+i.f||0)*k, last: q.n, uses: (lib[key] ? lib[key].uses : 0) + 1, auto: true};
  })));
  Object.entries(S.food.foods || {}).forEach(([key, f]) => {
    const a = lib[key];
    lib[key] = Object.assign({}, f, {key, uses: (a ? a.uses : 0) + 1, last: a && a.unit === f.unit ? a.last : (f.unit === 'g' ? 100 : 1), auto: false});
  });
  return lib;
}
function itemFrom(f, n){ const k = f.unit === 'g' ? n / 100 : n; return {name: f.name, qty: fmtQty(f.unit, n), kcal: r0(f.kcal*k), p: r0(f.p*k), c: r0(f.c*k), f: r0(f.f*k)}; }
function mealHistory(){
  const map = new Map();
  Object.values(S.food.days).forEach(d => (d.entries || []).forEach(e => {
    const key = norm(e.text); if (!key || !(e.items || []).length) return;
    const kcal = e.items.reduce((a,i) => a + (+i.kcal||0), 0), m = map.get(key);
    if (!m) map.set(key, {key, text: e.text, items: e.items, kcal, n: 1, t: e.t || 0, meals: {[e.meal]: 1}});
    else { m.n++; m.meals[e.meal] = (m.meals[e.meal] || 0) + 1; if ((e.t || 0) > m.t){ m.t = e.t || 0; m.items = e.items; m.text = e.text; m.kcal = kcal; } }
  }));
  return [...map.values()];
}
function frequent(meal){
  const all = mealHistory(), inMeal = all.filter(m => m.meals[meal]).sort((a,b) => (b.meals[meal] - a.meals[meal]) || (b.t - a.t));
  return (inMeal.length ? inMeal : all.sort((a,b) => (b.n - a.n) || (b.t - a.t))).slice(0, 5);
}
function searchMeals(q){
  const w = words(q); if (!w.length) return [];
  return mealHistory().filter(m => { const hay = norm(m.text + ' ' + m.items.map(i => i.name).join(' ')); return w.every(x => hay.includes(x)); })
    .sort((a,b) => (b.n - a.n) || (b.t - a.t)).slice(0, 5);
}
function searchFoods(q, n){
  const w = words(q), lib = Object.values(library());
  return (w.length ? lib.filter(f => w.every(x => norm(f.name).includes(x))) : lib).sort((a,b) => (b.uses - a.uses) || a.name.localeCompare(b.name, 'es')).slice(0, n);
}

function suggHTML(){

}

    </section>`;

  const wt = weightTrend();
  html += `<section class="card">
      <h3>Peso</h3>
      <p class="hint" style="margin-top:4px">Pésate en ayunas, después del baño. Lo que cuenta es el promedio semanal, no el número de un día.</p>

      </div>` : ''}
    </section>
    <p class="hint" style="text-align:center;margin:4px auto 0">Las calorías son estimaciones. Si en 2-3 semanas tu promedio no baja, ajusta la meta.</p>`;
  el.innerHTML = html;
}

async function calcFood(){
  const text = foodText.trim();
  if (!text){ toast('Escribe lo que comiste.'); return; }
  foodBusy = true; foodMsg = ''; foodPreview = null; renderFood();
  if (!sample && samplePromise) await samplePromise;
  if (!sample){ foodBusy = false; showManual = true; renderFood(); return; }
  foodCtl = new AbortController();
  const prompt = `Eres nutriólogo en México. Estima calorías y macronutrientes de lo que comió esta persona.
- Si no da cantidades, usa porciones típicas en México (taco de taquería, tortilla de maíz, bolillo, refresco de 600 ml, etc.).
- Desglosa por alimento o bebida. Incluye aceite, salsas, crema o queso solo si lo menciona o si el platillo normalmente los lleva.
- qty: la cantidad en formato "250 g", "200 ml" o "3 piezas" (usa piezas para huevos, tortillas, tostadas, tacos, pan, fruta entera).
- Números enteros. kcal = calorías, p = proteína en g, c = carbohidratos en g, f = grasa en g.
Responde SOLO con JSON con esta forma:
{"items":[{"name":"Taco al pastor","qty":"3 piezas","kcal":450,"p":24,"c":42,"f":21}],"note":"un supuesto breve que hiciste, o vacío"}
Si el texto no describe comida ni bebida, responde {"items":[],"note":"explica qué falta"}.

Lo que comió: """${text.slice(0, 1500)}"""`;
  try {
    const out = await sample.json(prompt, {modelTier: 'quick', signal: foodCtl.signal});
    const items = (out && Array.isArray(out.items) ? out.items : []).map(i => ({
      name: String(i.name || 'Alimento').slice(0, 80), qty: String(i.qty || '').slice(0, 40),
      kcal: Math.max(0, r0(i.kcal)), p: Math.max(0, r0(i.p)), c: Math.max(0, r0(i.c)), f: Math.max(0, r0(i.f))
    })).filter(i => i.kcal || i.p || i.c || i.f).map(i => Object.assign(i, {base: {kcal: i.kcal, p: i.p, c: i.c, f: i.f}}));
    if (!items.length) foodMsg = (out && out.note) ? String(out.note) : 'No reconocí comida en el texto. Intenta describirlo con más detalle.';
    else foodPreview = {items, note: out.note ? String(out.note).slice(0, 200) : ''};
  } catch(e){
    const c = e && e.code;
    if (c === 'cancelled') foodMsg = '';
    else if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed'){ sample = null; sampleState = 'none'; showManual = true; }
    else if (c === 'rate_limited') foodMsg = 'Llegaste al límite gratis de Gemini por ahora. Usa Armar plato o la captura manual, o intenta más tarde.';
    else if (c === 'bad_key') foodMsg = 'Tu clave de Gemini no funciona. Revísala en Ajustes (el engrane de arriba).';
    else foodMsg = 'No pude calcularlo. Revisa tu conexión y toca Calcular otra vez.';
  } finally { foodBusy = false; foodCtl = null; renderFood(); }
}

const PORTIONS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
const fmtPortion = f => ({0.25: '¼', 0.5: '½', 0.75: '¾', 1: '1', 1.25: '1¼', 1.5: '1½', 2: '2'}[f] || String(f));
function moveTargets(day){
  const today = dk(Date.now()), out = [], lbl = k => k === today ? 'Hoy' : k === dkShift(today, -1) ? 'Ayer' : k === dkShift(today, 1) ? 'Mañana' : dkParse(k).toLocaleDateString('es-MX', {weekday: 'short', day: 'numeric'});
  [dkShift(day, -1), dkShift(day, 1), today, dkShift(today, 1)].forEach(k => { if (k !== day && k <= dkShift(today, 7) && !out.some(o => o[0] === k)) out.push([k, lbl(k)]); });
  return out;
}
function editEntry(id, fn){
  const doc = JSON.parse(JSON.stringify(dayDoc(foodDay)));
  const e = (doc.entries || []).find(x => x.id === id); if (!e) return null;
  fn(e, doc); putDay(foodDay, doc); return e;
}

/* ---- Escáner de código de barras (Open Food Facts) ---- */
const BS = plug('BarcodeScanner');
async function scanBarcode(){
  if (!BS){ showScanInput = !showScanInput; renderFood(); if (showScanInput) setTimeout(() => $('#bcIn') && $('#bcIn').focus(), 50); return; }
  try {
    const av = await BS.isGoogleBarcodeScannerModuleAvailable().catch(() => ({available: true}));
    if (av && av.available === false){
      toast('Descargando el escáner de Google, intenta en unos segundos…');
      await BS.installGoogleBarcodeScannerModule().catch(() => {});
      return;
    }
    const r = await BS.scan();
    const bc = r && r.barcodes && r.barcodes[0];
    const code = bc && (bc.rawValue || bc.displayValue);
    if (code) lookupBarcode(code);
  } catch(e){
    if (!/cancel/i.test(String((e && e.message) || e))) { toast('No se pudo abrir el escáner. Escribe el código.'); showScanInput = true; renderFood(); }
  }
}
async function lookupBarcode(raw){
  const code = String(raw || '').replace(/\D/g, ''); if (code.length < 6){ toast('Ese código no parece válido.'); return; }
  const known = Object.entries(S.food.foods || {}).find(([, f]) => f.code === code);
  const toPlate = (key, serv) => { plate.push({key, n: Math.round(serv || 100)}); foodMode = 'plate'; plQ = ''; showScanInput = false; renderFood(); };
  if (known){ toPlate(known[0], known[1].serv); toast(`${known[1].name}: ajusta los gramos`); return; }
  toast('Buscando el producto…');
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_es,brands,nutriments,serving_quantity`);
    const d = await r.json();
    const p = d && d.status === 1 && d.product, nm = (p && p.nutriments) || {};
    const kcal = nm['energy-kcal_100g'] != null ? +nm['energy-kcal_100g'] : (nm['energy_100g'] != null ? nm['energy_100g'] / 4.184 : null);
    if (!p || kcal == null){
      toast('No encontré ese producto: agrégalo con los datos de la etiqueta');
      modeBack = 'plate'; editFood = null; foodMode = 'newfood'; showScanInput = false; renderFood();
      return;
    }
    const name = [p.product_name_es || p.product_name || 'Producto', String(p.brands || '').split(',')[0].trim()].filter(Boolean).join(' · ').slice(0, 80);
    const key = norm(name), serv = +p.serving_quantity || 100;
    S.food.foods[key] = {name, unit: 'g', kcal, p: +(nm.proteins_100g || 0), c: +(nm.carbohydrates_100g || 0), f: +(nm.fat_100g || 0), code, serv};
    S.food.hidden = (S.food.hidden || []).filter(k => k !== key); saveNut();
    toPlate(key, serv);
    toast(`${name}: ${r0(kcal)} kcal por 100 g. Ajusta los gramos.`);
  } catch(e){ toast('Sin conexión para buscar el producto. Intenta de nuevo o captúralo a mano.'); }
}

function addEntry(items, text){
  const doc = JSON.parse(JSON.stringify(dayDoc(foodDay)));
  doc.entries = doc.entries || [];
  const en = {id: uid(), meal: foodMeal, text: text.slice(0, 200), items: items.map(({base, ...i}) => i), t: Date.now()};
  if (foodPlanned) en.planned = true;
  doc.entries.push(en);
  putDay(foodDay, doc);
  if (foodPlanned){ foodPlanned = false; toast('Guardado como planeado: toca "Ya me lo comí" cuando lo comas'); }
}

$('#view-food').addEventListener('click', async e => {
  const t = e.target, b = t.closest('button'); if (!b) return;
  if (b.id === 'scanBtn'){ scanBarcode(); return; }
  if (b.id === 'bcGo'){ lookupBarcode($('#bcIn').value); return; }
  if (b.dataset.eate){ editEntry(b.dataset.eate, en => { delete en.planned; en.t = Date.now(); }); toast('Listo, ya cuenta en tu día'); renderFood(); return; }
  if (b.dataset.eopen){ entryOpen = entryOpen === b.dataset.eopen ? null : b.dataset.eopen; renderFood(); return; }
  if (b.dataset.portion){
    const [id, fs] = b.dataset.portion.split('|'), fac = +fs;
    editEntry(id, en => {
      en.base = en.base || en.items.map(i => Object.assign({}, i));
      en.portion = fac;
      en.items = en.base.map(i => Object.assign({}, i, {kcal: r0(i.kcal * fac), p: r0(i.p * fac), c: r0(i.c * fac), f: r0(i.f * fac)}));
      if (fac === 1){ delete en.portion; }
    });
    entryOpen = null; toast(fac === 1 ? 'Porción completa' : `Ajustado a ${fmtPortion(fac)} de la porción`); renderFood(); return;
  }
  if (b.dataset.moveto){
    const [id, target] = b.dataset.moveto.split('|');
    const src = JSON.parse(JSON.stringify(dayDoc(foodDay)));
    const en = (src.entries || []).find(x => x.id === id); if (!en) return;
    src.entries = src.entries.filter(x => x.id !== id);
    const dst = JSON.parse(JSON.stringify(dayDoc(target)));
    dst.entries = dst.entries || []; dst.entries.push(en);
    putDay(foodDay, src); putDay(target, dst);
    entryOpen = null; toast(`Movido a ${moveTargets(foodDay).find(m => m[0] === target)?.[1] || target}`); renderFood(); return;
  }
  if (b.id === 'setupSave'){
    const g = id => $('#' + id).value;
    const p = {sex: g('f-sex'), age: num(g('f-age')), height: num(g('f-height')), weight: num(g('f-weight')), act: g('f-act'), goal: g('f-goal')};
    if (!p.age || !p.height || !p.weight || p.age < 14 || p.height < 120 || p.weight < 35){ toast('Revisa edad, estatura y peso.'); return; }
    p.targets = calcTargets(p); p.updated = Date.now();
    S.food.profile = p; if (CLOUD) S.food.dirty._profile = true; showSetup = false;
    const doc = JSON.parse(JSON.stringify(dayDoc(dk(Date.now()))));
    if (!doc.weight){ doc.weight = p.weight; S.food.days[doc.date || dk(Date.now())] = doc; putDay(dk(Date.now()), doc); }
    saveLocal(); setStatus(); flushFood(); renderFood();
    toast(`Meta: ${p.targets.kcal.toLocaleString('es-MX')} kcal y ${p.targets.p} g de proteína`);
    return;
  }
  if (b.id === 'setupCancel'){ showSetup = false; renderFood(); return; }
  if (b.id === 'editGoal'){ showSetup = true; renderFood(); return; }
  if (b.id === 'dPrev'){ foodDay = dkShift(foodDay, -1); foodPreview = null; renderFood(); return; }
  if (b.id === 'dNext'){ const n = dkShift(foodDay, 1); if (n <= dkShift(dk(Date.now()), 7)){ foodDay = n; foodPreview = null; renderFood(); } return; }
  if (b.dataset.meal){ foodMeal = b.dataset.meal; renderFood(); return; }
  if (b.id === 'foodCalc'){ calcFood(); return; }
  if (b.id === 'foodStop'){ foodCtl && foodCtl.abort(); return; }
  if (b.id === 'manualOn'){ showManual = true; renderFood(); return; }
  if (b.id === 'manualOff'){ showManual = false; renderFood(); return; }
  if (b.id === 'manualAdd'){

    if (!name || kcal == null){ toast('Escribe al menos el alimento y las calorías.'); return; }
    addEntry([{name: name.slice(0,80), qty:'', kcal: r0(kcal), p: r0(num($('#m-p').value)), c: r0(num($('#m-c').value)), f: r0(num($('#m-f').value))}], name);

  }

  }

    const lib = library(), items = plate.filter(l => l.n > 0 && lib[l.key]).map(l => itemFrom(lib[l.key], l.n));

  }

  if (b.id === 'newFoodOn'){ modeBack = foodMode; editFood = null; foodMode = 'newfood'; renderFood(); return; }

  if (b.id === 'nfSave'){

  }
  if (b.dataset.fdel){

  if (b.dataset.rep != null){

    addEntry(JSON.parse(JSON.stringify(e2.items)), e2.text); toast(`Agregado a ${mealName(foodMeal).toLowerCase()}`); renderFood(); return;
  }
  if (b.dataset.edel){
    if (!(await ask('¿Quitar este registro?', 'Quitar', true))) return;
    const doc = JSON.parse(JSON.stringify(dayDoc(foodDay)));
    doc.entries = (doc.entries || []).filter(x => x.id !== b.dataset.edel);
    putDay(foodDay, doc); renderFood(); return;
  }
  if (b.id === 'sSave'){
    const v = num($('#sIn').value);
    if (v == null || v < 0 || v > 100000){ toast('Escribe tus pasos del día.'); return; }
    const doc = JSON.parse(JSON.stringify(dayDoc(foodDay)));
    doc.steps = Math.round(v); putDay(foodDay, doc);
    toast('Pasos guardados'); renderFood(); return;
  }
  if (b.id === 'wSave'){
    const w = num($('#wIn').value);
    if (!w || w < 30 || w > 300){ toast('Escribe tu peso en kg.'); return; }
    const doc = JSON.parse(JSON.stringify(dayDoc(foodDay)));
    doc.weight = Math.round(w * 10) / 10; putDay(foodDay, doc);
    toast('Peso guardado'); renderFood(); return;
  }
});
$('#view-food').addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'foodText'){ foodText = t.value; const sg = $('#sugg'); if (sg) sg.innerHTML = suggHTML(); return; }
  if (t.id === 'plQ'){ plQ = t.value; const ps = $('#plSugg'); if (ps) ps.innerHTML = plSuggHTML(); return; }
  if (t.dataset.pln != null){ const l = plate[+t.dataset.pln]; if (l){ l.n = num(t.value); updatePlate(); } return; }
  if (t.dataset.pv != null && foodPreview){
    const it = foodPreview.items[+t.dataset.pv], v = num(t.value);
    if (it && v != null){
      const b = it.base || it, k = b.kcal > 0 ? v / b.kcal : 1;
      it.kcal = r0(v); it.p = r0(b.p*k); it.c = r0(b.c*k); it.f = r0(b.f*k);
    }
  }
});
$('#view-food').addEventListener('change', e => {
  if (e.target.id === 'planTg'){ foodPlanned = e.target.checked; return; }
  if (e.target.dataset.pv != null) renderFood();
});
$('#view-food').addEventListener('keydown', e => { if (e.target.id === 'bcIn' && e.key === 'Enter'){ e.preventDefault(); lookupBarcode(e.target.value); } });

/* ---------- Navegación ---------- */
function switchView(v){
  view = v;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v));
  ['train','food','history','progress','settings'].forEach(k => $('#view-' + k).hidden = k !== v);
  $('#gearBtn').setAttribute('aria-pressed', v === 'settings');
  if (v === 'settings') renderSettings();
  if (v === 'train') renderTrain();
  if (v === 'food'){ foodDay = foodDay > dk(Date.now()) ? dk(Date.now()) : foodDay; renderFood(); }
  if (v === 'history') renderHistory();
  if (v === 'progress') renderProgress();
  window.scrollTo({top:0});
}
document.querySelector('.tabs').addEventListener('click', e => { const v = e.target.dataset.view; if (v) switchView(v); });

setStatus(); renderTrain();
if (S.draft && S.draft.start) requestWake();
initCloud();
</script>
