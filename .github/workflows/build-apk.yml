name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias y copiar la app web a Android
        run: |
          npm ci
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$(cat VERSION)'/" www/index.html
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "SDK en $SDK; sdkmanager: ${SDKM:-no encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" > sdk.log 2>&1 || { echo "::error title=SDK::$(tail -30 sdk.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          else
            echo "::error title=SDK::No encontré el Android SDK en $SDK"; ls -la "$SDK" || true; exit 1
          fi

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bitacora.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/bitacora.jks" >> "$GITHUB_ENV"
          else
            # Llave incluida en el repositorio: mantiene la misma firma en cada versión para que las actualizaciones se instalen encima
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/bitacora-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'B8hi_EalRv6CG62hJ7wXxiNW97ZtWVDO' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'bitacora' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'B8hi_EalRv6CG62hJ7wXxiNW97ZtWVDO' }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            echo "::error title=Gradle::$(grep -E 'error:|What went wrong|FAILURE|Exception|> ' build.log | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/BitacoraGym.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BitacoraGym-apk
          path: ${{ runner.temp }}/BitacoraGym.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$RUNNER_TEMP/BitacoraGym.apk" \
            --title "Bitácora Gym ${VERSION} (compilación ${GITHUB_RUN_NUMBER})" \
            --notes "Descarga **BitacoraGym.apk** desde tu celular y ábrelo para instalar o actualizar." \
            --latest
